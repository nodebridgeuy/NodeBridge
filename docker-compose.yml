services: 
  nodebridge_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nodebridge-app
    ports:
      - "3500:80"
    depends_on:
      - nodebridge_database
    networks:
      - nodebridge_network

  database:
    image: mariadb
    container_name: nodebridge-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: nodebridgedb
      MYSQL_USER: crudlite
      MYSQL_PASSWORD: crudlite
    ports:
      - "33060:3306"
    networks:
      - nodebridge_network
    volumes:
      - db-volume:/var/lib/mysql
      - ./others/bd.sql:/docker-entrypoint-initdb.d/bd.sql

volumes:
  db-volume:

networks:
nodebridge_network:
